<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Leaflet: Wild World Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4C14 14 8 32 14 50c18 6 36 0 46-18C50 18 42 8 32 4z' fill='%2342b36b'/%3E%3Cpath d='M16 48C26 36 34 26 46 16' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/wildworld.css">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-leaf" aria-hidden="true"></div>
      <div>
        <div class="brand-name">Leaflet</div>
        <div class="brand-sub">Wild World Editor</div>
      </div>
    </div>
    <div class="search-wrap">
      <input id="globalSearch" class="search" type="search" placeholder="Search options" autocomplete="off" spellcheck="false">
    </div>
    <nav id="nav" class="nav" aria-label="Sections"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>
  <main class="main">
    <header class="toolbar" id="toolbar">
      <div class="sky-orb" aria-hidden="true"></div>
      <div class="toolbar-title">
        <h1 id="pageTitle">Welcome</h1>
        <div id="pageSub" class="toolbar-sub"></div>
      </div>
      <div class="toolbar-actions">
        <div class="ww-clock" id="wwClock" aria-label="Current time"></div>
        <div id="bellChip" class="chip bell-chip" hidden></div>
        <button class="tb-btn" id="soundBtn" title="Sound effects" aria-pressed="true"></button>
        <button class="tb-btn" id="openBtn" title="Open a save file (⌘O)"><span class="i i-open"></span><span>Open</span></button>
        <button class="tb-btn primary" id="saveBtn" title="Save a copy (⌘S)" disabled><span class="i i-save"></span><span>Save</span></button>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<div id="guide" class="guide" aria-live="polite">
  <div class="guide-bubble" id="guideBubble"></div>
  <button class="guide-sprout" id="guideSprout" title="Sprout, your guide" aria-label="Sprout, your guide"></button>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="popover-root"></div>
<input type="file" id="fileInput" accept=".sav,.dsv,.duc,.bin,*/*" hidden>
<input type="file" id="fileInput2" hidden>

<script src="js/data.js"></script>
<script src="js/acreart.js"></script>
<script src="js/save.js"></script>
<script src="js/flags.js"></script>
<script src="js/events.js"></script>
<script src="js/calendar.js"></script>
<script src="js/lib/jsQR.js"></script>
<script src="js/gamesound.js"></script>
<script src="js/rom.js"></script>
<script src="js/ui.js"></script>
<script src="js/model3d.js"></script>
<script src="js/room.js"></script>
<script src="js/room3d.js"></script>
<script src="js/housemover.js"></script>
<script src="js/patternimport.js"></script>
<script src="js/patternstudio.js"></script>
<script src="js/tune.js"></script>
<script src="js/views-town.js"></script>
<script src="js/views-today.js"></script>
<script src="js/towncard.js"></script>
<script src="js/pockets.js"></script>
<script src="js/views-player.js"></script>
<script src="js/views-villager.js"></script>
<script src="js/views-house.js"></script>
<script src="js/views-museum.js"></script>
<script src="js/views-catalog.js"></script>
<script src="js/views-places.js"></script>
<script src="js/views-townlife.js"></script>
<script src="js/views-records.js"></script>
<script src="js/schema.js"></script>
<script src="js/views-advanced.js"></script>
<script src="js/views-explorer.js"></script>
<script src="js/views-doctor.js"></script>
<script src="js/backups.js"></script>
<script src="js/wfc.js"></script>
<script src="js/gameclock.js"></script>
<script src="js/linkapp.js"></script>
<script src="js/winhelper.js"></script>
<script src="js/views-sync.js"></script>
<script src="js/views-diary.js"></script>
<script src="js/views-patterns.js"></script>
<script src="js/app.js"></script>
<script src="js/ambience.js"></script>
</body>
</html>
